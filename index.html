<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SahaVest — Full Clickable Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002653; --teal:#006d42; --bg:#f3f4f5; --card:#ffffff;
    --border:#dfe1e3; --muted:#6b7280; --text:#191c1d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  .sidebar{width:280px;flex-shrink:0;background:var(--navy);color:#fff;overflow-y:auto;padding:20px 0 40px;}
  .brand{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:8px;}
  .brand h1{font-size:17px;margin:0 0 2px;font-weight:700;}
  .brand p{font-size:11px;margin:0;color:#9fb3c8;}
  .group-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7d92ab;padding:14px 20px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#cfd9e6;font-size:13px;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.1);color:#fff;border-left:3px solid #4fd1a5;font-weight:600;}
  .nav-item .idx{font-size:10px;color:#7d92ab;width:20px;flex-shrink:0;}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:24px;overflow:hidden;}
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;font-size:13px;color:var(--muted);}
  .topbar .screen-name{font-weight:600;color:var(--text);font-size:14px;}
  .counter{background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-size:12px;}

  .phone{width:390px;height:780px;border-radius:40px;border:10px solid #111;background:#000;box-shadow:0 20px 50px rgba(0,0,0,0.25);overflow:hidden;position:relative;}
  .phone iframe{width:100%;height:100%;border:none;background:#fff;}

  .controls{display:flex;align-items:center;gap:16px;margin-top:18px;}
  .nbtn{background:var(--card);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy);}
  .nbtn:hover{background:#eef1f4;}
  .nbtn:disabled{opacity:0.4;cursor:not-allowed;}
  .nbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px;}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <span class="screen-name" id="screenName">Loading…</span>
      <span class="counter" id="counter"></span>
    </div>
    <div class="phone"><iframe id="frame" title="Screen preview"></iframe></div>
    <div class="controls">
      <button class="nbtn" id="prevBtn">← Previous</button>
      <button class="nbtn primary" id="nextBtn">Next →</button>
    </div>
  </div>
</div>

<script>
// Ordered exactly per the sequence supplied: batch 0 -> 6, folder order within each batch.
const SCREENS = [
  { group: "0 — Cover", items: [
    ["splash_cover", "Guided prosperity — cover"],
  ]},
  { group: "1 — Onboarding & KYC", items: [
    ["language_selection", "Language selection"],
    ["identity_verification_consent", "Identity verification consent"],
    ["otp_verification", "OTP verification"],
    ["kyc_processing", "KYC processing"],
    ["risk_profiling_step_1", "Risk profiling — step 1"],
    ["mobile_authentication", "Mobile authentication"],
    ["your_risk_profile", "Your risk profile"],
    ["welcome_to_sahavest", "Welcome to SahaVest"],
    ["add_nominee_details", "Add nominee details"],
    ["account_aggregator_linking", "Account Aggregator linking"],
  ]},
  { group: "2 — Account Linking & Dashboard", items: [
    ["approve_data_sharing", "Approve data sharing"],
    ["select_institutions_to_link", "Select institutions to link"],
    ["manage_consents", "Manage consents"],
    ["linking_summary", "Linking summary"],
    ["linking_accounts...", "Linking accounts…"],
    ["dashboard_1", "Dashboard — net worth"],
    ["dashboard_2", "Dashboard — holdings view"],
    ["asset_allocation", "Asset allocation"],
    ["equity_holdings", "Equity holdings"],
    ["holding_details", "Holding details"],
  ]},
  { group: "3 — Performance, Goals & Twin", items: [
    ["returns_detail", "Returns detail"],
    ["performance_history", "Performance history"],
    ["goals_hub", "Goals hub"],
    ["goal_detail", "Goal detail"],
    ["investor_twin_simulator", "Investor Twin simulator"],
    ["portfolio_alert", "Portfolio alert"],
    ["simulation_results", "Simulation results"],
    ["tax_summary", "Tax summary"],
    ["scam_checker", "Scam checker"],
    ["scam_check_result", "Scam check result"],
  ]},
  { group: "4 — Trust & Safety", items: [
    ["verify_an_advisor", "Verify an advisor"],
    ["advisor_verification_result", "Advisor verification result"],
    ["pre_trade_suitability_nudge", "Pre-trade suitability nudge"],
    ["behavioral_alert_center", "Behavioral alert center"],
    ["trust_score_history", "Trust score history"],
    ["trust_score_detail", "Trust score detail"],
    ["registry_verification_detail", "Registry verification detail"],
    ["report_a_scam", "Report a scam"],
    ["safety_notifications", "Safety notifications"],
    ["learning_home", "Learning home"],
  ]},
  { group: "5 — Learning, Chat & Trade", items: [
    ["badges_achievements", "Badges & achievements"],
    ["leaderboard", "Leaderboard"],
    ["learning_module_detail", "Learning module detail"],
    ["quiz_screen", "Quiz screen"],
    ["order_intent_screen", "Order intent screen"],
    ["ai_chat_assistant", "AI chat assistant"],
    ["document_simplifier", "Document simplifier"],
    ["redirect_to_broker_bridge", "Redirect to broker bridge"],
    ["return_from_broker_sync_status", "Return from broker — sync status"],
    ["data_privacy_center", "Data privacy center"],
  ]},
  { group: "6 — Compliance, Grievance & Profile", items: [
    ["audit_trail_viewer", "Audit trail viewer"],
    ["file_a_grievance_scores", "File a grievance (SCORES)"],
    ["grievance_tracker", "Grievance tracker"],
    ["profile_settings", "Profile settings"],
    ["security_settings", "Security settings"],
    ["notification_preferences", "Notification preferences"],
    ["help_support", "Help & support"],
    ["ai_explainability_hub", "AI explainability hub"],
  ]},
];

const FLAT = [];
SCREENS.forEach(g => g.items.forEach(([slug, label]) => FLAT.push({ slug, label, group: g.group })));

let current = 0;

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  let html = `<div class="brand"><h1>SahaVest</h1><p>${FLAT.length} screens · full prototype</p></div>`;
  SCREENS.forEach(g => {
    html += `<div class="group-label">${g.group}</div>`;
    g.items.forEach(([slug, label]) => {
      const idx = FLAT.findIndex(f => f.slug === slug);
      html += `<button class="nav-item" data-idx="${idx}"><span class="idx">${String(idx+1).padStart(2,'0')}</span><span>${label}</span></button>`;
    });
  });
  sb.innerHTML = html;
  sb.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => goTo(parseInt(btn.dataset.idx, 10)));
  });
}

function goTo(i) {
  current = Math.max(0, Math.min(FLAT.length - 1, i));
  const s = FLAT[current];
  document.getElementById("frame").src = `screens/${encodeURIComponent(s.slug)}/code.html`;
  document.getElementById("screenName").textContent = s.label;
  document.getElementById("counter").textContent = `${current + 1} / ${FLAT.length}`;
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", parseInt(b.dataset.idx,10) === current));
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").disabled = current === FLAT.length - 1;
  const active = document.querySelector(".nav-item.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

document.getElementById("prevBtn").addEventListener("click", () => goTo(current - 1));
document.getElementById("nextBtn").addEventListener("click", () => goTo(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") goTo(current + 1);
  if (e.key === "ArrowLeft") goTo(current - 1);
});

renderSidebar();
goTo(0);
</script>
</body>
</html>
