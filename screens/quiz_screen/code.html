            border-color: #ba1a1a; /* error */
            background-color: #ffdad6; /* error-container */
            color: #93000a; /* on-error-container */

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar (Transactional - Hidden/Modified for focused journey) -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline">
<div class="flex items-center justify-between px-margin-mobile py-sm w-full max-w-7xl mx-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed">Knowledge Check</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-grow flex flex-col px-margin-mobile py-lg max-w-3xl mx-auto w-full md:px-lg">
<!-- Progress Indicator -->
<div class="mb-lg w-full">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">Question 3 of 5</span>
<span class="font-label-sm text-label-sm text-primary">60%</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 60%"></div>
</div>
</div>
<!-- Question Section -->
<section class="mb-xl">
<div class="inline-flex items-center px-3 py-1 rounded-full bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm mb-md border border-outline-variant">
<span class="material-symbols-outlined text-[16px] mr-1">shield</span>
                Financial Safety
            </div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-md tracking-tight">
                Which action is considered the safest approach when receiving an unexpected email asking to verify your bank login details?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Select the single best answer.
            </p>
</section>
<!-- Options Grid -->
<section class="flex flex-col gap-sm md:gap-md mb-xl flex-grow" id="quiz-options">
<button class="option-card w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-start min-h-[min(tap-target-min, auto)]" data-correct="false">
<div class="flex-shrink-0 w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center mr-md mt-1 option-marker">
<span class="font-label-md text-label-md">A</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface">Click the link provided in the email and enter your details quickly to secure your account.</p>
</div>
<div class="ml-sm hidden status-icon">
<span class="material-symbols-outlined text-error">close</span>
</div>
</button>
<button class="option-card w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-start min-h-[min(tap-target-min, auto)]" data-correct="false">
<div class="flex-shrink-0 w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center mr-md mt-1 option-marker">
<span class="font-label-md text-label-md">B</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface">Reply to the email asking if the request is genuinely from the bank before proceeding.</p>
</div>
<div class="ml-sm hidden status-icon">
<span class="material-symbols-outlined text-error">close</span>
</div>
</button>
<button class="option-card w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-start min-h-[min(tap-target-min, auto)]" data-correct="true">
<div class="flex-shrink-0 w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center mr-md mt-1 option-marker">
<span class="font-label-md text-label-md">C</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface font-medium">Do not click any links. Independently navigate to your bank's official website or app to check for alerts.</p>
</div>
<div class="ml-sm hidden status-icon">
<span class="material-symbols-outlined text-secondary">check_circle</span>
</div>
</button>
<button class="option-card w-full text-left bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-start min-h-[min(tap-target-min, auto)]" data-correct="false">
<div class="flex-shrink-0 w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center mr-md mt-1 option-marker">
<span class="font-label-md text-label-md">D</span>
</div>
<div class="flex-grow">
<p class="font-body-md text-body-md text-on-surface">Forward the email to a friend to see if they think it looks legitimate.</p>
</div>
<div class="ml-sm hidden status-icon">
<span class="material-symbols-outlined text-error">close</span>
</div>
</button>
</section>
<!-- Score Summary / Actions (Appears after selection) -->
<section class="hidden mt-auto bg-surface-container-low rounded-xl p-md border border-outline-variant" id="feedback-section">
<div class="flex flex-col md:flex-row justify-between items-center gap-md">
<div class="flex items-center">
<div class="w-12 h-12 rounded-full flex items-center justify-center mr-md bg-secondary-container text-on-secondary-container" id="feedback-icon-container">
<span class="material-symbols-outlined" id="feedback-icon" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface" id="feedback-title">Correct</h3>
<p class="font-body-md text-body-md text-on-surface-variant" id="feedback-desc">Phishing emails often create a false sense of urgency.</p>
</div>
</div>
<div class="flex gap-sm w-full md:w-auto">
<button class="flex-1 md:flex-none px-lg py-sm rounded-full border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-container-highest transition-colors min-h-[48px] flex items-center justify-center">
                        Retry
                    </button>
<button class="flex-1 md:flex-none px-lg py-sm rounded-full bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container transition-colors min-h-[48px] flex items-center justify-center">
                        Next
                        <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</section>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.option-card');
            const feedbackSection = document.getElementById('feedback-section');
            const feedbackIconContainer = document.getElementById('feedback-icon-container');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            
            let answered = false;

            options.forEach(option => {
                option.addEventListener('click', function() {
                    if (answered) return;
                    answered = true;

                    const isCorrect = this.getAttribute('data-correct') === 'true';

                    // Disable all options
                    options.forEach(opt => {
                        opt.classList.add('opacity-70', 'cursor-not-allowed');
                        opt.style.pointerEvents = 'none';
                        
                        // Show correct answer regardless
                        if (opt.getAttribute('data-correct') === 'true') {
                            opt.classList.remove('opacity-70');
                            opt.classList.add('border-secondary', 'bg-secondary-container', 'text-on-secondary-fixed');
                            opt.querySelector('.status-icon').classList.remove('hidden');
                            opt.querySelector('.status-icon span').textContent = 'check_circle';
                            opt.querySelector('.status-icon span').classList.add('text-secondary');
                        }
                    });

                    // Highlight selected
                    this.classList.remove('opacity-70');
                    this.classList.add('selected');
                    
                    if (isCorrect) {
                        this.classList.add('correct', 'border-[2px]');
                        feedbackIconContainer.className = 'w-12 h-12 rounded-full flex items-center justify-center mr-md bg-secondary-container text-on-secondary-container';
                        feedbackIcon.textContent = 'task_alt';
                        feedbackTitle.textContent = 'Excellent!';
                        feedbackTitle.className = 'font-headline-sm text-headline-sm text-secondary';
                    } else {
                        this.classList.add('incorrect', 'border-[2px]');
                        this.querySelector('.status-icon').classList.remove('hidden');
                        feedbackIconContainer.className = 'w-12 h-12 rounded-full flex items-center justify-center mr-md bg-error-container text-on-error-container';
                        feedbackIcon.textContent = 'cancel';
                        feedbackTitle.textContent = 'Not quite';
                        feedbackTitle.className = 'font-headline-sm text-headline-sm text-error';
                    }

                    // Show feedback
                    feedbackSection.classList.remove('hidden');
                    feedbackSection.classList.add('animate-fade-in-up');
                });
            });
        });
    </script>
</body></html>
