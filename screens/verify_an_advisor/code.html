<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .min-h-screen-safe { min-height: calc(100vh - env(safe-area-inset-bottom)); }
        
        /* Subtle Focus Animation */
        .search-input-wrapper:focus-within {
            box-shadow: 0 0 0 2px var(--tw-colors-primary-container);
            transition: all 0.2s ease;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline shadow-sm dark:shadow-none transition-colors duration-200">
<div class="flex justify-between items-center h-14 px-margin-mobile max-w-screen-md mx-auto w-full">
<div class="flex items-center gap-xs">
<!-- Fallback Avatar since image might not load perfectly -->
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant text-xl">account_circle</span>
</div>
</div>
<div class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">
                SahaVest
            </div>
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-screen-md mx-auto px-margin-mobile py-lg pb-32 flex flex-col gap-lg">
<!-- Page Header -->
<div class="flex flex-col gap-base">
<h1 class="font-headline-md text-headline-md text-on-surface">Verify Advisor</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ensure your financial advisor is registered with SEBI to protect your investments.</p>
</div>
<!-- Search Bar -->
<div class="relative w-full group search-input-wrapper rounded-[16px] bg-surface border border-outline-variant flex items-center h-14 px-sm overflow-hidden bg-white shadow-[0_4px_12px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-outline ml-sm mr-xs">search</span>
<input aria-label="Search Advisor" class="w-full h-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md placeholder:text-outline-variant outline-none" placeholder="Search by Name or SEBI Reg No." type="text">
</div>
<!-- Recent Searches Bento -->
<section class="flex flex-col gap-sm mt-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Recent Searches</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">
<!-- Recent Item 1 -->
<button class="flex items-center justify-between p-sm bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container transition-colors shadow-[0_2px_8px_rgba(0,0,0,0.02)] min-h-[44px]">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<div class="text-left">
<p class="font-label-md text-label-md text-on-surface">Ravi Kumar</p>
<p class="font-label-sm text-label-sm text-outline">INA000012345</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant text-sm">chevron_right</span>
</button>
<!-- Recent Item 2 -->
<button class="flex items-center justify-between p-sm bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container transition-colors shadow-[0_2px_8px_rgba(0,0,0,0.02)] min-h-[44px]">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">corporate_fare</span>
</div>
<div class="text-left">
<p class="font-label-md text-label-md text-on-surface">FinWealth Advisors</p>
<p class="font-label-sm text-label-sm text-outline">INA000098765</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant text-sm">chevron_right</span>
</button>
<!-- Recent Item 3 -->
<button class="flex items-center justify-between p-sm bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container transition-colors shadow-[0_2px_8px_rgba(0,0,0,0.02)] min-h-[44px]">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<div class="text-left">
<p class="font-label-md text-label-md text-on-surface">Sneha Desai</p>
<p class="font-label-sm text-label-sm text-outline">INA000054321</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant text-sm">chevron_right</span>
</button>
</div>
</section>
<!-- Authority Badge -->
<div class="mt-auto pt-xl flex justify-center w-full">
<div class="inline-flex items-center gap-xs px-md py-xs bg-surface-container-low rounded-full border border-surface-container">
<span class="material-symbols-outlined text-secondary text-lg" style="font-variation-settings: 'FILL' 1;">local_police</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Powered by SEBI Registry</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline shadow-lg dark:shadow-none transition-transform duration-150">
<div class="flex justify-around items-center h-16 w-full max-w-screen-md mx-auto px-2 pb-safe">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors min-h-[44px] min-w-[44px] rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">pie_chart</span>
<span class="font-label-sm text-label-sm">Portfolio</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors min-h-[44px] min-w-[44px] rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">search</span>
<span class="font-label-sm text-label-sm">Explore</span>
</a>
<!-- Active Tab: Shield maps to "Protection" / Verify Advisor Intent -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 min-h-[44px] min-w-[44px]" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label-sm text-label-sm">Shield</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors min-h-[44px] min-w-[44px] rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</div>
</nav>
</body></html>
