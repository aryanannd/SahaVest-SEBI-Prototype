<script>
        // Simple interaction for selecting language cards
        const buttons = document.querySelectorAll('.grid > button');
        
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active state from all
                buttons.forEach(b => {
                    b.classList.remove('border-primary', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'border-2');
                    b.classList.add('border-outline-variant', 'bg-surface-container-lowest', 'text-on-surface', 'border');
                    
                    const icon = b.querySelector('.material-symbols-outlined');
                    if(icon) {
                        icon.remove();
                        const spacer = document.createElement('div');
                        spacer.className = 'h-6 w-6 mb-2';
                        b.insertBefore(spacer, b.firstChild);
                    }
                });

                // Add active state to clicked
                this.classList.remove('border-outline-variant', 'bg-surface-container-lowest', 'text-on-surface', 'border');
                this.classList.add('border-primary', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'border-2');
                
                const spacer = this.querySelector('div.h-6.w-6');
                if(spacer) {
                    spacer.remove();
                    const icon = document.createElement('span');
                    icon.className = 'material-symbols-outlined text-primary mb-2';
                    icon.innerText = 'check_circle';
                    this.insertBefore(icon, this.firstChild);
                }
            });
        });
    </script>
