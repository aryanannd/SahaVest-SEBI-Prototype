<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:items-center md:justify-center">
<!-- Main Container -->
<main class="flex-1 flex flex-col px-margin-mobile pt-[64px] pb-xl w-full max-w-md mx-auto relative z-10 md:bg-surface-container-lowest md:rounded-xl md:shadow-sm md:border md:border-outline-variant md:min-h-[600px] md:pt-xl">
<!-- Back Button (Mobile only logic implies a flow) -->
<button aria-label="Go back" class="w-[44px] h-[44px] flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors absolute top-md left-margin-mobile md:static md:mb-lg">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Header Section -->
<header class="mt-xl md:mt-0 mb-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-xs">Enter Mobile Number</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We will send an OTP for verification</p>
</header>
<!-- Form Section -->
<form class="flex-1 flex flex-col" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Input Group -->
<div class="mb-auto">
<label class="block font-label-md text-label-md text-on-surface mb-base" for="mobile-number">Mobile Number</label>
<div class="relative flex items-center bg-surface-container-lowest border border-outline-variant rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow h-[56px] overflow-hidden">
<div class="flex items-center justify-center h-full px-md bg-surface-container-low border-r border-outline-variant text-on-surface font-body-lg text-body-lg">
                        +91
                    </div>
<input autocomplete="tel-national" class="flex-1 h-full bg-transparent border-none focus:ring-0 px-md font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="mobile-number" inputmode="numeric" maxlength="10" pattern="[0-9]*" placeholder="99999 99999" required="" type="tel">
</div>
</div>
<!-- Bottom Actions -->
<div class="mt-xl space-y-lg">
<!-- Terms Checkbox -->
<label class="flex items-start gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center w-[24px] h-[24px] shrink-0 mt-base">
<input class="peer appearance-none w-[20px] h-[20px] border-2 border-outline rounded bg-surface-container-lowest checked:bg-primary checked:border-primary transition-colors focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background outline-none" required="" type="checkbox">
<span class="material-symbols-outlined absolute text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" data-icon="check">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant pt-1 leading-relaxed">
                        By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                    </span>
</label>
<!-- CTA Button -->
<button class="w-full h-[56px] bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-xs hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all disabled:opacity-30 disabled:pointer-events-none shadow-sm" type="submit">
                    Send OTP
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- Subtle Background Pattern for Desktop -->
<div class="hidden md:block fixed inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 2px 2px, var(--tw-colors-outline-variant) 1px, transparent 0); background-size: 32px 32px;"></div>
