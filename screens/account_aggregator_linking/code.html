<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md antialiased p-margin-mobile">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.04)] border border-outline-variant p-lg md:p-xl flex flex-col">

<button class="w-[44px] h-[44px] flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Graphic Area -->
<div class="relative w-full h-[200px] mb-lg flex items-center justify-center overflow-hidden rounded-lg bg-surface-container-lowest">
<!-- Center Node (SahaVest) -->
<div class="z-10 bg-primary text-on-primary w-20 h-20 rounded-full flex items-center justify-center shadow-lg absolute">
<span class="material-symbols-outlined text-display-lg" data-icon="assured_workload">assured_workload</span>
</div>
<!-- Peripheral Nodes (Banks/Brokers) -->
<div class="absolute left-4 top-4 bg-surface-container-highest w-14 h-14 rounded-full flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance">account_balance</span>
</div>
<div class="absolute right-4 bottom-4 bg-surface-container-highest w-14 h-14 rounded-full flex items-center justify-center animate-pulse" style="animation-delay: 0.5s;">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="finance">finance</span>
</div>
<div class="absolute left-8 bottom-8 bg-surface-container-highest w-12 h-12 rounded-full flex items-center justify-center animate-pulse" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="wallet">wallet</span>
</div>
<!-- Connecting Lines (SVG) -->
<svg class="absolute inset-0 w-full h-full text-outline-variant opacity-50" preserveAspectRatio="none" viewBox="0 0 100 100">
<path d="M 50,50 L 20,20" stroke="currentColor" stroke-dasharray="2,2" stroke-width="1"></path>
<path d="M 50,50 L 80,80" stroke="currentColor" stroke-dasharray="2,2" stroke-width="1"></path>
<path d="M 50,50 L 30,80" stroke="currentColor" stroke-dasharray="2,2" stroke-width="1"></path>
</svg>

<p class="font-body-md text-body-md text-on-surface-variant mb-lg px-2">

            </p>
