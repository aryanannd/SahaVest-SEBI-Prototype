<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Top Navigation Placeholder - Suppressed as this is a transactional flow, but keeping a minimal back action for context if needed, though strictly a focused journey -->
<div class="fixed top-0 left-0 w-full p-margin-mobile flex justify-start z-50 max-w-lg mx-auto md:max-w-none">
<button class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</div>
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-lg sm:p-xl flex flex-col gap-lg z-10 relative overflow-hidden">
<!-- Subtle Background Accent -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header Section -->
<div class="flex flex-col gap-sm text-center">
<div class="mx-auto w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center text-on-primary-fixed-variant mb-xs">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface tracking-tight">Verify OTP</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Enter the 6-digit code sent to<br>
<span class="font-headline-sm text-headline-sm text-on-surface">+91 9XXXXX1234</span>
</p>
</div>
<!-- OTP Input Form -->
<form class="flex flex-col gap-lg w-full" id="otpForm">
<div class="flex justify-between gap-xs sm:gap-sm">
<!-- Box 1 -->
<input aria-label="Digit 1" class="otp-input w-full h-[56px] text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:bg-surface-container-lowest transition-all text-on-surface outline-none" maxlength="1" pattern="\d*" required="" type="number">
<!-- Box 2 -->
<input aria-label="Digit 2" class="otp-input w-full h-[56px] text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:bg-surface-container-lowest transition-all text-on-surface outline-none" maxlength="1" pattern="\d*" required="" type="number">
<!-- Box 3 -->
<input aria-label="Digit 3" class="otp-input w-full h-[56px] text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:bg-surface-container-lowest transition-all text-on-surface outline-none" maxlength="1" pattern="\d*" required="" type="number">
<!-- Box 4 -->
<input aria-label="Digit 4" class="otp-input w-full h-[56px] text-center font-headline-md text-headline-md bg-surface border-error rounded-lg focus:border-error focus:ring-2 focus:ring-error-container focus:bg-surface-container-lowest transition-all text-error outline-none" maxlength="1" pattern="\d*" required="" type="number" value="8">
<!-- Box 5 -->
<input aria-label="Digit 5" class="otp-input w-full h-[56px] text-center font-headline-md text-headline-md bg-surface border-error rounded-lg focus:border-error focus:ring-2 focus:ring-error-container focus:bg-surface-container-lowest transition-all text-error outline-none" maxlength="1" pattern="\d*" required="" type="number">
<!-- Box 6 -->
<input aria-label="Digit 6" class="otp-input w-full h-[56px] text-center font-headline-md text-headline-md bg-surface border-error rounded-lg focus:border-error focus:ring-2 focus:ring-error-container focus:bg-surface-container-lowest transition-all text-error outline-none" maxlength="1" pattern="\d*" required="" type="number">
</div>
<!-- Error State Example -->
<div class="flex items-center gap-xs text-error font-label-md text-label-md justify-center mt-[-8px]">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span>Incorrect code. Please try again.</span>
</div>
<!-- Auto-read hint & Timer -->
<div class="flex flex-col items-center gap-base">
<div class="flex items-center gap-xs text-on-surface-variant font-body-md text-body-md">
<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
<span>Waiting for OTP...</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant">
                    Resend OTP in <span class="font-headline-sm text-headline-sm text-on-surface ml-1">00:45</span>
</p>
</div>
<!-- Action Button -->
<button class="w-full h-[56px] bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full flex items-center justify-center mt-xs hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all disabled:opacity-30 disabled:pointer-events-none" type="button">
                Verify &amp; Proceed
            </button>
</form>
<!-- Secondary Action -->
<div class="text-center mt-xs border-t border-outline-variant/30 pt-md">
<button class="font-label-md text-label-md text-primary hover:text-primary-container hover:underline underline-offset-4 min-h-[44px] px-md transition-colors">
                Having trouble? Get help
             </button>
</div>
</main>
<script>
        // Minimal script for OTP input behavior (auto-focus next/prev)
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
