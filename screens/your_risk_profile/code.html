<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center justify-between px-margin-mobile py-sm w-full max-w-7xl mx-auto">
<div class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">SahaVest</h1>
<div class="w-10 h-10"></div> <!-- Placeholder to balance header -->
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl max-w-7xl mx-auto w-full relative overflow-hidden">
<!-- Abstract Background Element for 'Zen' feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-secondary-container via-surface to-background"></div>
<div class="relative z-10 w-full max-w-lg flex flex-col items-center text-center space-y-xl">
<!-- Result Badge -->
<div class="flex flex-col items-center space-y-sm">
<div class="w-24 h-24 rounded-full bg-secondary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[48px] text-on-secondary-container" data-icon="balance">balance</span>
</div>
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary">MODERATE RISK</h2>
</div>
<!-- Explanation Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-outline-variant shadow-sm w-full">
<p class="font-body-lg text-body-lg text-on-surface">
                    You prefer a balance of growth and safety, accepting some market fluctuations.
                </p>
<div class="mt-lg pt-md border-t border-surface-container-highest">
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="update">update</span>
                        Your profile should be retaken in 12 months
                    </p>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col space-y-md pt-lg">
<button class="w-full h-[56px] rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]">
                    Continue
                </button>
<button class="w-full h-[48px] rounded-lg bg-surface text-primary border border-outline-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors active:scale-[0.98]">
                    Retake Test
                </button>
</div>
</div>
</main>
