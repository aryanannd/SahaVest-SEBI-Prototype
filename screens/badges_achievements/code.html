<!-- Modal for Badge Details -->
<div class="fixed inset-0 z-[100] hidden items-center justify-center modal-overlay p-margin-mobile" id="badgeModal">
<div class="absolute inset-0 bg-on-background/20" id="modalBackdrop"></div>
<div class="relative bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant w-full max-w-sm overflow-hidden z-10 transform scale-95 opacity-0 transition-all duration-200" id="modalContent">
<div class="flex justify-end p-xs absolute top-0 right-0 w-full">
<button class="w-tap-target-min h-tap-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full" id="closeModalBtn">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="p-lg flex flex-col items-center text-center mt-sm">
<div class="w-24 h-24 rounded-full flex items-center justify-center mb-md relative" id="modalIconContainer">
<span class="material-symbols-outlined text-5xl" id="modalIcon"></span>
<div class="hidden absolute bottom-0 right-0 bg-surface-container-highest rounded-full p-1 border-4 border-surface-container-lowest" id="modalLockOverlay">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs" id="modalTitle">Badge Title</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-md" id="modalDesc">Description goes here.</p>
<div class="bg-surface-container-low px-md py-xs rounded-full hidden" id="modalDateContainer">
<span class="font-label-md text-label-md text-on-surface-variant">Earned: <span id="modalDate"></span></span>
</div>
<div class="font-label-md text-label-md text-outline hidden" id="modalLockedText">
                    Keep exploring to unlock this achievement.
                </div>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const badges = document.querySelectorAll('.badge-btn');
            const modal = document.getElementById('badgeModal');
            const modalContent = document.getElementById('modalContent');
            const modalBackdrop = document.getElementById('modalBackdrop');
            const closeModalBtn = document.getElementById('closeModalBtn');

            const mTitle = document.getElementById('modalTitle');
            const mDesc = document.getElementById('modalDesc');
            const mIconContainer = document.getElementById('modalIconContainer');
            const mIcon = document.getElementById('modalIcon');
            const mDateContainer = document.getElementById('modalDateContainer');
            const mDate = document.getElementById('modalDate');
            const mLockedText = document.getElementById('modalLockedText');
            const mLockOverlay = document.getElementById('modalLockOverlay');

            const openModal = () => {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                // Trigger reflow
                void modal.offsetWidth;
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            };

            const closeModal = () => {
                modalContent.classList.remove('scale-100', 'opacity-100');
                modalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 200);
            };

            badges.forEach(badge => {
                badge.addEventListener('click', () => {
                    const title = badge.getAttribute('data-title');
                    const desc = badge.getAttribute('data-desc');
                    const earned = badge.getAttribute('data-earned') === 'true';
                    const date = badge.getAttribute('data-date');
                    const iconName = badge.querySelector('.material-symbols-outlined').getAttribute('data-icon');

                    mTitle.textContent = title;
                    mDesc.textContent = desc;
                    mIcon.textContent = iconName;
                    mIcon.setAttribute('data-icon', iconName);

                    mIconContainer.className = 'w-24 h-24 rounded-full flex items-center justify-center mb-md relative';
                    
                    if (earned) {
                        mIconContainer.classList.add('bg-secondary-container');
                        mIcon.classList.remove('text-outline');
                        mIcon.classList.add('text-secondary');
                        mDateContainer.classList.remove('hidden');
                        mDate.textContent = date;
                        mLockedText.classList.add('hidden');
                        mLockOverlay.classList.add('hidden');
                    } else {
                        mIconContainer.classList.add('bg-surface-variant', 'grayscale', 'opacity-75');
                        mIcon.classList.remove('text-secondary');
                        mIcon.classList.add('text-outline');
                        mDateContainer.classList.add('hidden');
                        mLockedText.classList.remove('hidden');
                        mLockOverlay.classList.remove('hidden');
                    }

                    openModal();
                });
            });

            closeModalBtn.addEventListener('click', closeModal);
            modalBackdrop.addEventListener('click', closeModal);
        });
    </script>
